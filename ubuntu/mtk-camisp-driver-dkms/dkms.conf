# drivers/media/platform/mtk-isp/isp_7x/mtk-ipesys-me/mtk-ipesys-me.ko
# drivers/misc/mediatek/imgsensor/src-v4l2/imgsensor-glue/imgsensor-glue.ko
# drivers/misc/mediatek/imgsensor/src-v4l2/imgsensor.ko
# drivers/remoteproc/mtk-ccd.ko
# drivers/rpmsg/mtk-ccd-rpmsg.ko


BUILT_MODULE_NAME[0]="mtk_camera"
