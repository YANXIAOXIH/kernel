#mtk-camisp-drivers
PLATFORM=${PLATFORM:-@GENIO_PLATFORM@}
PACKAGE_NAME="mediatek-camisp-${PLATFORM}"
PACKAGE_VERSION="24.1"

MAKE="'make' PLATFORM=$PLATFORM KERNEL_SRC=$kernel_source_dir"
CLEAN="'make' PLATFORM=$PLATFORM KERNEL_SRC=$kernel_source_dir clean"


# drivers/media/platform/mtk-camera/mtk_camera.ko
# drivers/media/platform/mtk-isp/isp_7x/camsys/src/mtk-cam-isp.ko
